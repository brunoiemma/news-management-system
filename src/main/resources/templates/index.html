<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Portal de Noticias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Portal de Noticias</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/category/deportes">Deportes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/category/automotor">Automotor</a>
                    </li>
                </ul>
                <div class="navbar-nav">
                    <a class="nav-link" th:href="@{/login}">Login</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>Top 5 Noticias Más Leídas</h2>
        <div class="row">
            <div class="col-md-4 mb-4" th:each="article : ${topArticles}">
                <div class="card">
                    <img th:if="${article.imageUrl}" th:src="${article.imageUrl}" class="card-img-top" alt="News Image">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${article.title}">Título</h5>
                        <p class="card-text" th:text="${#strings.abbreviate(article.content, 100)}">Contenido...</p>
                        <a th:href="@{/news/{id}(id=${article.id})}" class="btn btn-primary">Leer más</a>
                        <small class="text-muted" th:text="'Vistas: ' + ${article.viewCount}"></small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
