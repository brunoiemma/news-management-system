<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>User Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2>User Management</h2>
        <div class="row mb-3">
            <div class="col">
                <a th:href="@{/admin/dashboard}" class="btn btn-secondary">Back to Dashboard</a>
                <a th:href="@{/admin/users/create}" class="btn btn-primary">Create New User</a>
            </div>
        </div>
        
        <table class="table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th>Created</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="user : ${users}">
                    <td th:text="${user.id}">1</td>
                    <td th:text="${user.username}">username</td>
                    <td th:text="${user.firstName + ' ' + user.lastName}">Full Name</td>
                    <td th:text="${user.email}">email@example.com</td>
                    <td>
                        <span th:text="${user.role}"
                              th:class="${'badge ' + 
                                         (user.role == T(com.example.demo.model.Role).ROLE_ADMIN ? 'bg-danger' : '') + 
                                         (user.role == T(com.example.demo.model.Role).ROLE_PUBLISHER ? 'bg-success' : '') + 
                                         (user.role == T(com.example.demo.model.Role).ROLE_REDACTOR ? 'bg-info' : '') + 
                                         (user.role == T(com.example.demo.model.Role).ROLE_SUBSCRIBER ? 'bg-secondary' : '')}">
                            Role
                        </span>
                    </td>
                    <td>
                        <span th:text="${user.active ? 'Active' : 'Inactive'}"
                              th:class="${'badge ' + (user.active ? 'bg-success' : 'bg-danger')}">
                            Status
                        </span>
                    </td>
                    <td th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm')}">2023-01-01</td>
                    <td>
                        <div class="btn-group">
                            <a th:href="@{/admin/users/edit/{id}(id=${user.id})}" 
                               class="btn btn-sm btn-primary">Edit</a>
                            <a th:href="@{/admin/users/change-password/{id}(id=${user.id})}" 
                               class="btn btn-sm btn-warning">Change Password</a>
                            <form th:action="@{/admin/users/delete/{id}(id=${user.id})}" 
                                  method="post" style="display: inline;"
                                  onsubmit="return confirm('Are you sure you want to delete this user?');">
                                <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
