<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Buscar Noticias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" th:href="@{/admin}">Admin Dashboard</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/admin/fetch-news}">Buscar Noticias</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/articles}">Gestionar Artículos</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>Buscar Noticias</h2>
        <form th:action="@{/admin/fetch-news}" method="post">
            <div class="mb-3">
                <label for="url" class="form-label">URL de la Noticia</label>
                <input type="url" class="form-control" id="url" name="url" required 
                       placeholder="https://example.com/article">
            </div>
            <button type="submit" class="btn btn-primary">Importar Artículo</button>
        </form>
        
        <!-- Error message display -->
        <div th:if="${error}" class="alert alert-danger mt-3" role="alert">
            <span th:text="${error}"></span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
