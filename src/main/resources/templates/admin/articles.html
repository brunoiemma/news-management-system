<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Articles Administration</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2>Articles Administration</h2>
        <div class="row mb-3">
            <div class="col-md-8">
                <a th:href="@{/admin/dashboard}" class="btn btn-secondary">Back to Dashboard</a>
                <a th:href="@{/admin/articles/create}" class="btn btn-primary">Create New Article</a>
            </div>
            <div class="col-md-4">
                <form th:action="@{/admin/articles}" method="get" class="d-flex">
                    <select name="status" class="form-select me-2">
                        <option value="">All Statuses</option>
                        <option th:each="status : ${statuses}"
                                th:value="${status}"
                                th:text="${status.displayName}"
                                th:selected="${status == selectedStatus}">
                        </option>
                    </select>
                    <button type="submit" class="btn btn-outline-primary">Filter</button>
                </form>
            </div>
        </div>
        <table class="table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Category</th>
                    <th>Status</th>
                    <th>Views</th>
                    <th>Published</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="article : ${articles}">
                    <td th:text="${article.id}">1</td>
                    <td th:text="${article.title}">Title</td>
                    <td th:text="${article.category}">Category</td>
                    <td>
                        <span th:text="${article.status.displayName}"
                              th:class="${'badge ' + 
                                         (article.status == T(com.example.demo.model.ArticleStatus).PUBLISHED ? 'bg-success' : '') + 
                                         (article.status == T(com.example.demo.model.ArticleStatus).DRAFT ? 'bg-warning' : '') + 
                                         (article.status == T(com.example.demo.model.ArticleStatus).IN_REVIEW ? 'bg-info' : '') + 
                                         (article.status == T(com.example.demo.model.ArticleStatus).REJECTED ? 'bg-danger' : '') +
                                         (article.status == T(com.example.demo.model.ArticleStatus).ARCHIVED ? 'bg-secondary' : '') +
                                         (article.status == T(com.example.demo.model.ArticleStatus).SCHEDULED ? 'bg-primary' : '') +
                                         (article.status == T(com.example.demo.model.ArticleStatus).NEEDS_REVISION ? 'bg-warning' : '') +
                                         (article.status == T(com.example.demo.model.ArticleStatus).PENDING_APPROVAL ? 'bg-info' : '')}">
                            Status
                        </span>
                    </td>
                    <td th:text="${article.viewCount}">0</td>
                    <td th:text="${#temporals.format(article.publishDate, 'yyyy-MM-dd HH:mm')}">2023-01-01</td>
                    <td>
                        <a th:href="@{/admin/articles/edit/{id}(id=${article.id})}" class="btn btn-sm btn-primary">Edit</a>
                        <a th:href="@{/admin/articles/delete/{id}(id=${article.id})}" 
                           class="btn btn-sm btn-danger"
                           onclick="return confirm('Are you sure you want to delete this article?')">Delete</a>
                    </td>
                </tr>
            </tbody>
        </table>
        <a href="/admin/articles/new" class="btn btn-primary">Add New Article</a>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
